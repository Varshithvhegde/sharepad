<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c8c4ba"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#faf9f6"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Notebook -->
  <g transform="translate(720 120) rotate(2)">
    <rect x="0" y="0" width="360" height="400" fill="#ffffff" stroke="#1c1c1c" stroke-width="4"/>
    <line x1="56" y1="0" x2="56" y2="400" stroke="#e3a9a4" stroke-width="3"/>
    <g stroke="#ccc9bc" stroke-width="2">
      <line x1="56" y1="120" x2="330" y2="120"/>
      <line x1="56" y1="160" x2="330" y2="160"/>
      <line x1="56" y1="200" x2="330" y2="200"/>
      <line x1="56" y1="240" x2="330" y2="240"/>
      <line x1="56" y1="280" x2="330" y2="280"/>
      <line x1="56" y1="320" x2="330" y2="320"/>
    </g>
    <text x="80" y="70" font-family="Georgia, serif" font-size="34" fill="#1c1c1c">Iceland, March</text>
    <g stroke="#1c1c1c" stroke-width="4" stroke-linecap="round">
      <line x1="80" y1="112" x2="290" y2="112"/>
      <line x1="80" y1="152" x2="250" y2="152"/>
      <line x1="80" y1="192" x2="300" y2="192"/>
      <line x1="80" y1="232" x2="220" y2="232"/>
    </g>
    <!-- tape -->
    <rect x="130" y="-16" width="100" height="30" fill="#fde047" fill-opacity="0.75" transform="rotate(-3 180 -1)"/>
  </g>

  <!-- Index tabs -->
  <g>
    <rect x="1068" y="180" width="86" height="38" fill="#fef9c3" stroke="#1c1c1c" stroke-width="3"/>
    <rect x="1068" y="234" width="86" height="38" fill="#dbeafe" stroke="#1c1c1c" stroke-width="3"/>
    <rect x="1068" y="288" width="86" height="38" fill="#fce7f3" stroke="#1c1c1c" stroke-width="3"/>
  </g>

  <!-- Wordmark -->
  <text x="90" y="252" font-family="Georgia, serif" font-size="86" fill="#1c1c1c">SharePad</text>
  <path d="M92,282 C170,272 250,290 330,278 C410,266 470,286 540,278"
        stroke="#c8443c" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text x="92" y="348" font-family="Georgia, serif" font-size="38" fill="#5a5850">Write it down. Send one link.</text>
  <text x="92" y="404" font-family="Georgia, serif" font-size="27" fill="#aaa89e">Markdown notebooks · no signup · expires when you say</text>
</svg>
